<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>MindMap Render Test</title>
  <style>
    #mindmap-container {
      position: fixed;
      inset: 0;
      z-index: 1000;
    }
    #mindmap-container svg {
      width: 100%;
      height: 100%;
    }
    #result {
      position: fixed;
      top: 10px;
      right: 10px;
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 10px;
      font-family: monospace;
      font-size: 12px;
      z-index: 10000;
      min-width: 200px;
    }
  </style>
</head>
<body>
  <div id="result">Testing...</div>
  <div id="mindmap-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script type="module">
    const resultEl = document.getElementById('result');
    const container = document.getElementById('mindmap-container');
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 800 600');
    svg.setAttribute('width', '100%');
    svg.setAttribute('height', '100%');
    container.appendChild(svg);

    const testMarkdown = `# React
- 概念
  - 组件化
  - 声明式
- Hooks
  - useState
  - useEffect
  - useContext
- 生态
  - Next.js
  - Remix`;

    async function runTest() {
      try {
        const { Transformer } = await import('https://cdn.jsdelivr.net/npm/markmap-lib@0.18.12/+esm');
        const { Markmap } = await import('https://cdn.jsdelivr.net/npm/markmap-view@0.18.12/+esm');

        const transformer = new Transformer();
        const { root } = transformer.transform(testMarkdown);

        const mm = Markmap.create(svg, {
          duration: 500,
          autoFit: true,
          fitRatio: 0.95,
          nodeMinHeight: 30,
          spacingHorizontal: 100,
          spacingVertical: 10,
          paddingX: 10,
          initialExpandLevel: -1,
        }, root);

        await new Promise(r => setTimeout(r, 1500));

        const nodes = document.querySelectorAll('.markmap-node');
        const links = document.querySelectorAll('.markmap-link');

        let hasNaN = false;
        for (const g of Array.from(nodes)) {
          const transform = g.getAttribute('transform');
          if (transform && transform.includes('NaN')) {
            hasNaN = true;
            break;
          }
        }

        const result = {
          nodeCount: nodes.length,
          linkCount: links.length,
          hasNaN: hasNaN,
          status: nodes.length > 0 && links.length > 0 && !hasNaN ? 'PASS' : 'FAIL'
        };

        resultEl.textContent = JSON.stringify(result, null, 2);
        resultEl.style.background = result.status === 'PASS' ? 'rgba(0,128,0,0.8)' : 'rgba(255,0,0,0.8)';
        window.__mindmapTestResult__ = result;

      } catch (err) {
        resultEl.textContent = 'ERROR: ' + err.message;
        resultEl.style.background = 'rgba(255,0,0,0.8)';
        window.__mindmapTestResult__ = { status: 'ERROR', error: err.message };
      }
    }

    runTest();
  </script>
</body>
</html>
