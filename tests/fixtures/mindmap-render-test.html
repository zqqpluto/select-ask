<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>MindMap Render Test</title>
  <style>
    #mindmap-container {
      position: fixed;
      inset: 0;
      z-index: 1000;
    }
    #mindmap-container svg {
      width: 100%;
      height: 100%;
    }
    #result {
      position: fixed;
      top: 10px;
      right: 10px;
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 10px;
      font-family: monospace;
      font-size: 12px;
      z-index: 10000;
      min-width: 200px;
    }
  
  </style>
</head>
<body>
  <div id="result">Testing...</div>
  <div id="mindmap-container"></div>
  <div class="select-ask-mindmap-toolbar" style="position:fixed;bottom:12px;right:12px;z-index:1001;">
    <div style="position:relative;">
      <button class="select-ask-mindmap-toolbar-btn" title="导出">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        <svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </button>
    </div>
    <div style="width:1px;height:16px;background:rgba(0,0,0,0.12);"></div>
    <button class="select-ask-mindmap-toolbar-btn" title="缩小">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/>
      </svg>
    </button>
    <button class="select-ask-mindmap-toolbar-btn" title="放大">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/>
      </svg>
    </button>
    <button class="select-ask-mindmap-toolbar-btn" title="适配">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
      </svg>
    </button>
    <span class="select-ask-mindmap-toolbar-zoom">100%</span>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script type="module">
    const resultEl = document.getElementById('result');
    const container = document.getElementById('mindmap-container');
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 800 600');
    svg.setAttribute('width', '100%');
    svg.setAttribute('height', '100%');
    container.appendChild(svg);

    const testMarkdown = `# React
- 概念
  - 组件化
  - 声明式
- Hooks
  - useState
  - useEffect
  - useContext
- 生态
  - Next.js
  - Remix`;

    async function runTest() {
      try {
        const { Transformer } = await import('https://cdn.jsdelivr.net/npm/markmap-lib@0.18.12/+esm');
        const { Markmap } = await import('https://cdn.jsdelivr.net/npm/markmap-view@0.18.12/+esm');

        const transformer = new Transformer();
        const { root } = transformer.transform(testMarkdown);

        const mm = Markmap.create(svg, {
          duration: 500,
          autoFit: true,
          fitRatio: 0.95,
          nodeMinHeight: 30,
          spacingHorizontal: 100,
          spacingVertical: 10,
          paddingX: 10,
          initialExpandLevel: -1,
        }, root);

        await new Promise(r => setTimeout(r, 1500));

        const nodes = document.querySelectorAll('.markmap-node');
        const links = document.querySelectorAll('.markmap-link');

        let hasNaN = false;
        for (const g of Array.from(nodes)) {
          const transform = g.getAttribute('transform');
          if (transform && transform.includes('NaN')) {
            hasNaN = true;
            break;
          }
        }

        const result = {
          nodeCount: nodes.length,
          linkCount: links.length,
          hasNaN: hasNaN,
          status: nodes.length > 0 && links.length > 0 && !hasNaN ? 'PASS' : 'FAIL'
        };

        resultEl.textContent = JSON.stringify(result, null, 2);
        resultEl.style.background = result.status === 'PASS' ? 'rgba(0,128,0,0.8)' : 'rgba(255,0,0,0.8)';
        window.__mindmapTestResult__ = result;

      } catch (err) {
        resultEl.textContent = 'ERROR: ' + err.message;
        resultEl.style.background = 'rgba(255,0,0,0.8)';
        window.__mindmapTestResult__ = { status: 'ERROR', error: err.message };
      }
    }

    runTest();
  </script>
</body>
</html>
